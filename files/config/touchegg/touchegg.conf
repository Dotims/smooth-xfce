<touchégg>
  <!-- macOS-style gestures (2026-10-17) -->
  <settings>
    <property name="animation_delay">150</property>
    <property name="action_execute_threshold">20</property>
    <property name="color">7AA2F7</property>
    <property name="borderColor">7AA2F7</property>
  </settings>
  <application name="All">
    <!-- 3 fingers up: every window at once (Super+Tab) -->
    <gesture type="SWIPE" fingers="3" direction="UP">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>skippy-xd --expose</command>
        <on>end</on>
      </action>
    </gesture>
    <!-- 3 fingers down: show the desktop, again to bring windows back -->
    <gesture type="SWIPE" fingers="3" direction="DOWN">
      <action type="SHOW_DESKTOP">
        <animate>true</animate>
      </action>
    </gesture>
    <!-- 4 fingers sideways: next / previous workspace -->
    <gesture type="SWIPE" fingers="4" direction="LEFT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>@HOME@/.local/bin/ws next</command>
        <on>end</on>
      </action>
    </gesture>
    <gesture type="SWIPE" fingers="4" direction="RIGHT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>@HOME@/.local/bin/ws prev</command>
        <on>end</on>
      </action>
    </gesture>
    <!-- 4 fingers up: windows from every workspace -->
    <gesture type="SWIPE" fingers="4" direction="UP">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>skippy-xd --expose --desktop -1</command>
        <on>end</on>
      </action>
    </gesture>
  </application>
</touchégg>

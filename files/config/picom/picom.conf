# picom: blur, shadows, rounded corners, open/close animations, dim inactive windows
# Uses window rules (picom 12+); legacy *-exclude options are ignored once rules exist.
# Backups: ~/.config/desktop-polish-backup-20261016/

backend = "glx";
vsync = true;
use-damage = true;

blur-method = "dual_kawase";
blur-strength = 8;
blur-background = true;
blur-background-frame = true;

shadow = true;
shadow-radius = 22;
shadow-opacity = 0.45;
shadow-offset-x = -22;
shadow-offset-y = -16;

corner-radius = 10;

# fade only where no animation script runs (menus, tooltips)
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 8;

rules = (
  # app windows: soft scale+fade on open/close, minimise/restore
  { match = "window_type = 'normal' || window_type = 'dialog'";
    animations = (
      { triggers = [ "open", "show" ]; preset = "appear"; scale = 0.94; duration = 0.17; },
      { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 0.94; duration = 0.13; }
    );
  },

  # inactive app windows slightly darker, so the focused one stands out
  { match = "window_type = 'normal' && !focused && !fullscreen"; dim = 0.10; },

  # panel: glass blur, no picom shadow/rounding (gtk.css draws it)
  { match = "window_type = 'dock' || class_g = 'xfce4-panel' || class_g = 'Xfce4-panel'";
    shadow = false; corner-radius = 0; },
  { match = "window_type = 'desktop'"; shadow = false; corner-radius = 0; blur-background = false; },

  # menus/tooltips crisp and square
  { match = "window_type = 'menu' || window_type = 'popup_menu' || window_type = 'dropdown_menu'";
    corner-radius = 0; blur-background = false; },
  { match = "window_type = 'tooltip'"; shadow = false; corner-radius = 0; blur-background = false; },
  { match = "window_type = 'dnd'"; shadow = false; },
  # notifications: corners match the notifyd theme radius
  { match = "window_type = 'notification' || class_g = 'Xfce4-notifyd'"; corner-radius = 12;
    animations = ( { triggers = [ "open", "show" ]; preset = "slide-in"; direction = "left"; duration = 0.18; },
                   { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 0.96; duration = 0.14; } ); },

  # screenshot tools: their region-select overlay must stay untouched
  { match = "class_g = 'Calendar-popup'"; corner-radius = 12; shadow = true; blur-background = true;
    animations = ( { triggers = [ "open", "show" ]; preset = "appear"; scale = 0.96; duration = 0.14; },
                   { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 0.97; duration = 0.11; } ); },
  { match = "class_g = 'Xfce4-screenshooter' || class_g = 'xfce4-screenshooter' || class_i = 'xfce4-screenshooter' || class_g = 'Flameshot' || class_g = 'flameshot' || class_i = 'flameshot'";
    shadow = false; corner-radius = 0; blur-background = false; dim = 0; animations = (); },

  # client-side decorated windows draw their own shadow and corners
  { match = "_GTK_FRAME_EXTENTS@"; shadow = false; corner-radius = 0; blur-background = false; },
  { match = "class_g = 'firefox' && argb"; blur-background = false; },

  # fullscreen and maximised sit flush with the screen edges
  { match = "fullscreen || _NET_WM_STATE@[*] = '_NET_WM_STATE_MAXIMIZED_VERT'"; corner-radius = 0; }
)

Section "Device"
    Identifier "NVIDIA GPU"
    Driver     "nvidia"
    # tear-free output from the driver; without it picom's GLX vsync stalls X and dragged windows trail the mouse
    Option     "ForceCompositionPipeline" "on"
    # an HDMI monitor powering off sends no hotplug, so xfdesktop keeps the icons (DP still sends one)
    Option     "UseHotplugEvents" "false"
EndSection
